<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Melissa Ramirez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Melissa Ramirez</h1>
        </div>
        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="about.html">About me</a>
            <a href="projects.html">Main Projects</a>
            <a href="contact.html" class="active">Contact me</a>
        </nav>
    </header>
    <div class="desktop-menu-bar">
        <span>operations</span>
        <span>digital-transformation</span>
        <span>process-improvement</span>    
        <span>languages</span>
        <span>interactive-media</span>
    </div>
    <main class="contact-main-container">    
        <h2 class="bold-title">GET IN TOUCH</h2>
        <section class="contact-container-grid">       
            <div class="contact-left">
                <img src="images/img2.jpg" alt="Melissa Ramirez Portrait" class="contact-photo">
                
                <div class="direct-contact-box">
                    <h3>Direct Contact</h3>
                    <a href="https://www.linkedin.com/in/melyalanis" target="_blank" rel="noopener noreferrer" class="contact-row-link">
                        <span class="icon">💼</span>
                        <span class="text">LinkedIn Profile</span>
                    </a>
                </div>
            </div>
            <div class="contact-right">
                <form class="contact-form">                
                    <div class="form-group">
                        <label for="user-email">EMAIL</label>
                        <input type="email" id="user-email" name="email" placeholder="write your email" required>
                    </div>
                    <div class="form-group">
                        <label for="user-message">MESSAGE</label>
                        <textarea id="user-message" name="message" rows="5" placeholder="Write your message or project proposal here..." required></textarea>
                    </div>
                    <div class="form-action">
                        <button type="submit" class="send-btn">SEND</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>Copyright &copy; 2026 - Created by Melissa Ramirez</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
